name: Deploy to GitHub Pages

# The site is already static HTML, CSS and JS — there is nothing to
# build. This workflow just uploads the repo and hands it to Pages.
#
# Deploys from the DEFAULT branch on purpose. The github-pages
# environment restricts deployments to the default branch, and GitHub
# only registers a workflow (sidebar entry, "Run workflow" button) if
# its file exists there. Publishing from any other branch fails before
# the job starts, with no logs — which looks like a broken workflow
# but is really a branch restriction.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # Nothing secret in here — it is local tool permissions — but
      # there is no reason to serve it either.
      - name: Drop files that should not be published
        run: rm -rf .claude

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
